[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adazor"
version = "0.3.0"
description = "ADAZOR: label-free concept drift detection via a Z-test on the outlier rate of a one-class SVM."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Anna Maria Zanaboni" },
  { name = "Dario Malchiodi" },
  { name = "Antoine Nasra" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "river>=0.22",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adazor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
