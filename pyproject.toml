[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adazor"
version = "0.1.0"
description = "Concept drift detection library and experiments for streaming machine learning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Donnie" }
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "river",
  "jupyter"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]