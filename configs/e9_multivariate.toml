# Multivariate shifts (third review, M1/M3): shift families of Rabanser et al.
# applied to the eight datasets, plus a correlation flip that keeps every
# marginal distribution unchanged; each detector over a range of its parameter.
# Severities fixed before running: noise 0.5 sd, translation of norm 1 sd,
# knock-out of half the features, a subpopulation making up 30% of the data.
name = "e9_multivariate"
seeds = [42, 52, 62]

[run_defaults]
n = 250
r = 0.1
eval_every = 0

[outlier]
nu = 0.1
gamma = "auto"
standardize = true

[[models]]
name = "gnb"
standardize = true

