# Sect. 5.5: comparison with label-free baselines and ADAZOR variants.
name = "e6_comparison"
seeds = [42, 52, 62, 72, 82]

[run_defaults]
n = 250
r = 0.1
eval_every = 0

[outlier]
# standardization on each window + gamma = 1/d: the default everywhere
nu = 0.1
gamma = "auto"
standardize = true

[[models]]
name = "gnb"
standardize = true

[[monitors]]
kind = "adazor"
alpha = 0.025
label = "ADAZOR"

[[monitors]]
kind = "adazor"
alpha = 0.025
variance = "pooled"
label = "ADAZOR pooled"

[[monitors]]
kind = "adazor"
alpha = 0.025
baseline = "holdout"
label = "ADAZOR hold-out"

[[monitors]]
kind = "adazor"
alpha = 0.025
variance = "pooled"
baseline = "holdout"
label = "ADAZOR pooled hold-out"

[[monitors]]
kind = "ocdd"
f = 0.1
label = "OCDD f=0.1"

[[monitors]]
kind = "ocdd"
f = 0.15
label = "OCDD f=0.15"

[[monitors]]
kind = "ocdd"
f = 0.2
label = "OCDD f=0.2"

[[monitors]]
kind = "ocdd"
f = 0.25
label = "OCDD f=0.25"

[[monitors]]
kind = "kswin"
alpha = 0.005
label = "KSWIN"

[[monitors]]
kind = "d3"
rho = 0.2
tau = 0.7
label = "D3"

[[streams]]
kind = "mixture"
scenario = "setting1"

[[streams]]
kind = "mixture"
scenario = "setting2"

[[streams]]
kind = "mixture"
scenario = "setting1_abrupt"

[[streams]]
kind = "mixture"
scenario = "setting2_abrupt"

[[streams]]
kind = "mixture"
scenario = "virtual"

[[streams]]
kind = "mixture"
scenario = "virtual_abrupt"

[[streams]]
kind = "mixture"
scenario = "label_swap_abrupt"

[[streams]]
kind = "mixture"
scenario = "stationary"

[[streams]]
kind = "injected"
file = "artificial/sea_stream.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "artificial/sea_stream.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "artificial/sea_big.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "artificial/sea_big.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "artificial/rotatingHyperplane.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "artificial/rotatingHyperplane.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "real-world/spam.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "real-world/spam.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "real-world/phishing.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "real-world/phishing.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "real-world/weather.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "real-world/weather.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "real-world/elec.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "real-world/elec.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[[streams]]
kind = "injected"
file = "real-world/airlines2.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

[[streams]]
kind = "injected"
file = "real-world/airlines2.csv"
feature = "auto"
position = 2000
width = 1000
length = 12000

[analysis]
tol = 250

[[analysis.tables]]
name = "simulations"
where = {stream = ["setting1", "setting2", "setting1_abrupt", "setting2_abrupt", "virtual", "virtual_abrupt", "label_swap_abrupt", "stationary"]}
group_by = ["monitor"]
metrics = ["n_missed", "mean_delay", "false_alarms_per_1000", "n_alerts", "prequential_accuracy"]
digits = 2

[[analysis.tables]]
name = "by_scenario"
where = {stream = ["setting1", "setting2", "setting1_abrupt", "setting2_abrupt", "virtual", "virtual_abrupt", "label_swap_abrupt", "stationary"]}
group_by = ["stream", "monitor"]
metrics = ["n_missed", "mean_delay", "n_false_alarms"]
digits = 2

[[analysis.tables]]
name = "injected"
group_by = ["monitor"]
where = {stream = ["sea_stream (shift, w=0)", "sea_stream (shift, w=1000)", "sea_big (shift, w=0)", "sea_big (shift, w=1000)", "rotatingHyperplane (shift, w=0)", "rotatingHyperplane (shift, w=1000)", "spam (shift, w=0)", "spam (shift, w=1000)", "phishing (shift, w=0)", "phishing (shift, w=1000)", "weather (shift, w=0)", "weather (shift, w=1000)", "elec (shift, w=0)", "elec (shift, w=1000)", "airlines2 (shift, w=0)", "airlines2 (shift, w=1000)"]}
metrics = ["n_missed", "mean_delay", "false_alarms_per_1000", "n_alerts", "prequential_accuracy"]
digits = 2
