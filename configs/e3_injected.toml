[analysis]
tol = 250

[[analysis.tables]]
name = "detection"
group_by = ["stream", "monitor"]
metrics = ["n_alerts", "n_missed", "mean_delay", "n_false_alarms", "false_alarms_per_1000", "prequential_accuracy"]
digits = 2

[[analysis.tables]]
name = "overall"
group_by = ["monitor"]
metrics = ["n_missed", "mean_delay", "false_alarms_per_1000"]
digits = 2
