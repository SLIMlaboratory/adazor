# Real datasets with an input shift injected at a known position (abrupt and gradual).
name = "e3_injected"
seeds = [42, 52, 62, 72, 82]

[run_defaults]
n = 250
r = 0.1
eval_every = 0

[outlier]
# standardization on each window + gamma = 1/d: the default everywhere
nu = 0.1
gamma = "auto"
standardize = true

[[models]]
name = "gnb"
standardize = true

[[monitors]]
kind = "none"
label = "none"

[[monitors]]
kind = "ocdd"
f = 0.1
label = "OCDD f=0.1"

[[monitors]]
kind = "adazor"
alpha = 0.025
label = "ADAZOR"

[[monitors]]
kind = "adazor"
alpha = 0.025
baseline = "holdout"
label = "ADAZOR hold-out"


[[monitors]]
kind = "adazor"
alpha = 0.025
variance = "pooled"
baseline = "holdout"
current = "unseen"
label = "ADAZOR pooled unseen"

[[monitors]]
kind = "adazor"
alpha = 0.025
baseline = "holdout"
current = "unseen"
label = "ADAZOR conservative unseen"

[[streams]]
kind = "injected"
file = "artificial/sea_stream.csv"
feature = "auto"
position = 2000
width = 0
length = 12000

